<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>webkit userland primitive</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:12px 14px; }
  #state { font-size:18px; font-weight:700; margin:0 0 8px; }
  #toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
             margin:0 0 10px; padding:10px 12px; background:#11151b;
             border:1px solid #1e2732; border-radius:5px; }
  #toolbar label { font-size:13px; color:#9aa3b2; margin-right:4px; }
  #toolbar select { background:#0b0d10; color:#c8ced8; border:1px solid #1e2732;
                     border-radius:4px; padding:6px 8px; font:inherit; }
  #toolbar button { background:#1a2330; color:#e6ebf2; border:1px solid #2a3544;
                    border-radius:4px; padding:8px 12px; font:inherit; cursor:pointer; }
  #toolbar button:disabled { opacity:0.45; cursor:default; }
  #toolbar button.primary { background:#1e3a2f; border-color:#3a6b54; }
  #toolbar button.danger { background:#3a2220; border-color:#6b3a3a; }
  #hint { font-size:12px; color:#9aa3b2; margin:0 0 8px; line-height:1.4; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 200px); overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">loading...</div>
  <div id="toolbar">
    <label for="fw-select">offsets</label>
    <select id="fw-select">
      <option value="auto">auto (UA)</option>
      <option value="13.52">13.52</option>
      <option value="13.50">13.50</option>
      <option value="13.00">13.00</option>
      <option value="12.50">12.50</option>
    </select>
    <button type="button" class="primary" id="btn-establish">1 - get primitive</button>
    <button type="button" id="btn-offsets" disabled>2 - offset tests</button>
    <button type="button" id="btn-calibrate" disabled>3 - calibrate wk</button>
    <button type="button" id="btn-all">run all (1 then 2)</button>
    <button type="button" id="btn-clear">clear log</button>
    <button type="button" class="danger" id="btn-lowmem">low-mem reload</button>
  </div>
  <p id="hint">Serve over HTTP (not file://). Exploit loads only when you tap step 1. Close browser fully before retrying.</p>
  <div id="out"></div>
</div>
<script>
window.addEventListener("error", function (e) {
  var s = document.getElementById("state");
  var o = document.getElementById("out");
  var msg = "JS error: " + (e.message || e);
  if (s) { s.textContent = msg; s.className = "bad"; }
  if (o) o.textContent = msg + "\n" + (e.filename || "") + ":" + (e.lineno || "");
});
</script>
<script type="module" src="./test_primitive.js"></script>
</body>
</html>
