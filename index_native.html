<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 native lite</title>
<style>
  html,body{margin:0;padding:12px;background:#0b0d10;color:#c8ced8;font:15px system-ui}
  #state{font-size:18px;font-weight:700;margin:0 0 10px}
  button{background:#1e3a2f;color:#eee;border:1px solid #3a6b54;border-radius:4px;padding:10px 16px;font:inherit;margin:4px 8px 4px 0}
  button:disabled{opacity:.4}
  #fn-in{width:300px;background:#111;border:1px solid #333;color:#eee;padding:8px;font:12px monospace;margin:8px 0;display:block}
  #out{white-space:pre-wrap;font:11px monospace;background:#111;padding:10px;max-height:55vh;overflow:auto;margin-top:10px}
  .ok{color:#7fd0a0}.bad{color:#d08a7f}.warn{color:#d8c07f}
  p{font-size:12px;color:#9aa3b2;max-width:720px}
  code{font:12px monospace;color:#b8c4e0}
</style>
</head>
<body>
<script>if(!location.search)location.replace(location.pathname+"?g=drain:96&g=slots:2000000&freshprep=1&pivot=ta&pivotfn=parseInt");</script>
<div id="state">native lite</div>
<p>Minimal heap — no rw_demo UI. Default <code>?g=drain:96&amp;g=slots:2000000&amp;freshprep=1&amp;pivot=ta&amp;pivotfn=parseInt</code></p>
<button type="button" id="btn-start">Start</button>
<button type="button" id="btn-smoke" disabled>Fire smoke</button>
<button type="button" id="btn-getpid" disabled>Fire getpid</button>
<input id="fn-in" placeholder="k_usleep fn ptr … then Accept" autocomplete="off">
<button type="button" id="btn-accept" disabled>Accept fn</button>
<div id="out"></div>
<script type="module" src="./native_lite.js?v=native-lite-1"></script>
</body>
</html>
