<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 WebKit — arbitrary R/W demo</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:12px 14px; max-width:960px; }
  #state { font-size:18px; font-weight:700; margin:0 0 8px; }
  #toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
             margin:0 0 10px; padding:10px 12px; background:#11151b;
             border:1px solid #1e2732; border-radius:5px; }
  #toolbar button { background:#1e3a2f; color:#e6ebf2; border:1px solid #3a6b54;
                    border-radius:4px; padding:10px 16px; font:inherit; cursor:pointer; }
  #toolbar button:disabled { opacity:0.45; cursor:default; }
  #toolbar button.secondary { background:#1a2330; border-color:#2a3544; }
  #peek-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
              margin:0 0 10px; padding:8px 12px; background:#0d1117;
              border:1px solid #1e2732; border-radius:5px; }
  #peek-bar input, #peek-bar select { background:#0b0d10; color:#c8ced8;
              border:1px solid #2a3544; border-radius:4px; padding:6px 8px;
              font:12px Consolas, monospace; }
  #addr-in { width:180px; }
  #hint { font-size:12px; color:#9aa3b2; margin:0 0 10px; line-height:1.45; }
  h2 { font-size:13px; color:#9aa3b2; margin:14px 0 6px; font-weight:600; }
  #map { width:100%; border-collapse:collapse; font:11px/1.35 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px; }
  #map th, #map td { text-align:left; padding:6px 8px; border-bottom:1px solid #1e2732; }
  #map th { color:#9aa3b2; font-weight:600; }
  #map tr:hover td { background:#151b24; }
  #map .addr { color:#7eb8da; cursor:pointer; }
  #hex { white-space:pre-wrap; font:11px/1.4 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:8px 10px; min-height:48px; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:11px/1.4 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; max-height:40vh; overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">ready — close browser fully if prior OOM</div>
  <div id="toolbar">
    <button type="button" id="btn-start">Start arbitrary R/W</button>
    <button type="button" class="secondary" id="btn-refresh" disabled>Refresh map</button>
    <button type="button" class="secondary" id="btn-clear">Clear log</button>
  </div>
  <p id="hint"><b>Start</b> retries the SSV race until <code>PRIMITIVE-OK</code> (no give-up). Then logs every leaked pointer as <code>ADDR</code> lines + table. <b>Scope:</b> WebKit browser process only.</p>
  <h2>Known pointers (this process)</h2>
  <table id="map">
    <thead><tr><th>label</th><th>address</th><th>note</th></tr></thead>
    <tbody id="map-body"><tr><td colspan="3">— run Start first —</td></tr></tbody>
  </table>
  <h2>Hex peek</h2>
  <div id="peek-bar">
    <select id="pick-ptr" disabled><option value="">pick known ptr…</option></select>
    <input type="text" id="addr-in" placeholder="813aa2880 or 0x…" autocomplete="off" disabled>
    <button type="button" class="secondary" id="btn-peek" disabled>peek 64 bytes</button>
  </div>
  <div id="hex">—</div>
  <h2>Log</h2>
  <div id="out"></div>
</div>
<script>
window.addEventListener("error", function (e) {
  var s = document.getElementById("state");
  if (s) { s.textContent = "JS error: " + (e.message || e); s.className = "bad"; }
});
</script>
<script type="module" src="./rw_demo.js"></script>
</body>
</html>
