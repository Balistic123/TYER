<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 notify lite</title>
<style>
  html,body{margin:0;padding:12px;background:#0b0d10;color:#c8ced8;font:15px system-ui}
  #state{font-size:18px;font-weight:700;margin:0 0 10px}
  button{background:#1e3a2f;color:#eee;border:1px solid #3a6b54;border-radius:4px;padding:10px 16px;font:inherit;margin-right:8px}
  button:disabled{opacity:.4}
  #lk-in{width:280px;background:#111;border:1px solid #333;color:#eee;padding:8px;font:12px monospace;margin:8px 0}
  #out{white-space:pre-wrap;font:11px monospace;background:#111;padding:10px;max-height:50vh;overflow:auto;margin-top:10px}
  .ok{color:#7fd0a0}.bad{color:#d08a7f}.warn{color:#d8c07f}
  p{font-size:12px;color:#9aa3b2}
</style>
</head>
<body>
<div id="state">loading…</div>
<p><b>Lite notify</b> — only core+mem (no rw_demo). Start → Pin → paste k_usleep fn → Fire.</p>
<button type="button" id="btn-start">Start</button>
<button type="button" id="btn-pin" disabled>Pin notify</button>
<button type="button" id="btn-fire" disabled>Fire notify</button>
<br>
<input id="lk-in" placeholder="k_usleep fn ptr or lk base …000" autocomplete="off">
<div id="out"></div>
<script>
window.addEventListener("error", function (e) {
  var m = "ERROR " + (e.message || e);
  try { sessionStorage.setItem("wk-notify-log", (sessionStorage.getItem("wk-notify-log")||"") + "\n" + m); } catch(_){}
  document.getElementById("state").textContent = m;
});
</script>
<script type="module">
import "./notify_lite.js?v=notify-lite-2";
</script>
</body>
</html>
